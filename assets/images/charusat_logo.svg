<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="CHARUSAT University Logo">
  <!-- Background shield/emblem -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2247;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5c518;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a017;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield emblem -->
  <path d="M 50 8 L 14 22 L 14 52 C 14 72 32 88 50 95 C 68 88 86 72 86 52 L 86 22 Z"
        fill="url(#shieldGrad)" stroke="#d4a017" stroke-width="2"/>

  <!-- Torch flame inside shield -->
  <ellipse cx="50" cy="35" rx="6" ry="10" fill="url(#goldGrad)" opacity="0.9"/>
  <path d="M 50 25 Q 44 30 46 38 Q 50 32 54 38 Q 56 30 50 25 Z" fill="#f5c518"/>

  <!-- Torch handle -->
  <rect x="47" y="44" width="6" height="18" rx="2" fill="url(#goldGrad)"/>
  <rect x="43" y="60" width="14" height="3" rx="1.5" fill="#d4a017"/>

  <!-- Book lines (open book) -->
  <path d="M 22 72 Q 50 68 78 72" stroke="#f5c518" stroke-width="1.5" fill="none"/>

  <!-- University name -->
  <text x="100" y="32" font-family="Georgia, 'Times New Roman', serif" font-size="20"
        font-weight="bold" fill="#1a3a6b" letter-spacing="2">CHARUSAT</text>

  <!-- Full name -->
  <text x="100" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="8.5"
        fill="#1a3a6b" letter-spacing="0.5">Charotar University of Science &amp; Technology</text>

  <!-- Divider line -->
  <line x1="100" y1="57" x2="305" y2="57" stroke="#d4a017" stroke-width="1.2"/>

  <!-- Location & established -->
  <text x="100" y="70" font-family="Arial, sans-serif" font-size="8"
        fill="#444444" letter-spacing="0.3">Changa, Anand District, Gujarat  |  Est. 2009</text>

  <!-- NAAC badge -->
  <rect x="100" y="78" width="58" height="14" rx="3" fill="#1a3a6b"/>
  <text x="129" y="88" font-family="Arial, sans-serif" font-size="8" font-weight="bold"
        fill="#f5c518" text-anchor="middle">NAAC A+ Grade</text>
</svg>
